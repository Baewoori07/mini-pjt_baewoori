[project]
name = "swimcoach"
version = "0.1.0"
description = "Local swim training coach chat app (FastAPI + SQLite + Bedrock)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic[bedrock]>=0.40",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
